name: Artifact
description: 'Artifact is a consumer service that captures and preserves family stories
  through professional, guided interviews. The company conducts remote 30-minute interviews
  with a family member and edits each one into a studio-quality ~20-minute audio episode,
  hosted on a private webpage where relatives can add photos and share the recording.
  Episodes are priced per interview, positioning the product as a way to record a loved
  one''s life story and memories. Backed by GV (Google Ventures) in the consumer sector.
  As of 2026 the company announced it is winding down: new Artifacts are no longer sold,
  and previously purchased interviews may be scheduled through October 31. The service
  exposes no public developer API, SDKs, or documentation surface.'
